# beans — ONE container, registry-driven local inference.
# Required: BEANS_ROOT must point at your models registry (see README.md).
#   BEANS_ROOT=/srv/models docker compose up -d --build
# No personal paths live anywhere in this repo.
#
# No Olla: each model's bridge IS the server. ONE published port — the beansd
# router on :11434 — serves the whole OpenAI API (model name in the body routes
# to the owning bridge). Bridges bind loopback inside the container; workers on
# the host use http://127.0.0.1:11434, worker containers reach beans by name on
# the beans_net external network (e.g. http://beans:11434 for embeddings).
services:
  beans:
    build: .
    image: beans:1ctr
    container_name: beans
    restart: unless-stopped
    gpus: all
    ports:
      - "127.0.0.1:11434:11434"   # beansd router — one OpenAI-compatible API
    volumes:
      - ${BEANS_ROOT:?Set BEANS_ROOT to your models registry root (one dir per model)}:/beans
    networks:
      - default
      - beans_net

networks:
  beans_net:
    external: true