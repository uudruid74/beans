# beans — ONE container, registry-driven local inference.
# Required: BEANS_ROOT must point at your models registry (see README.md).
#   BEANS_ROOT=/srv/models docker compose up -d --build
# No personal paths live anywhere in this repo.
#
# No Olla: each model's bridge IS the server. Ports are published
# localhost-only; the container also joins beans_net so worker containers can
# reach beans by name (e.g. http://beans:8081 for embeddings).
services:
  beans:
    build: .
    image: beans:1ctr
    container_name: beans
    restart: unless-stopped
    gpus: all
    ports:
      - "127.0.0.1:8081:8081"   # nomic-embed bridge (embeddings)
      - "127.0.0.1:8082:8082"   # ornith bridge (chat)
    volumes:
      - ${BEANS_ROOT:?Set BEANS_ROOT to your models registry root (one dir per model)}:/beans
    networks:
      - default
      - beans_net

networks:
  beans_net:
    external: true